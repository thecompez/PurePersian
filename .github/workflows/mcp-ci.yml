name: Validate PurePersian MCP

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "purepersian_mcp/**"
      - "tools/**"
      - "tests/**"
      - "pyproject.toml"
      - "persian.tex"
      - "adverbs.tex"
      - ".github/workflows/mcp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP server
        run: python -m pip install -e .
      - name: Validate generated lexical data
        run: python tools/export_lexicon.py --check
      - name: Compile Python source
        run: python -m compileall -q purepersian_mcp tools tests
      - name: Verify release wheel includes the lexical data
        run: |
          python -m pip wheel --no-deps . -w dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as wheel:
              assert "purepersian_mcp/lexicon.json" in wheel.namelist()
              assert "purepersian_mcp/server.py" in wheel.namelist()
          PY

      - name: Run unit and in-memory MCP protocol tests
        run: python -m unittest discover -s tests -v

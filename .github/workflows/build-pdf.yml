name: Build Persian PDF

on:
  push:
    branches: [main]
    paths:
      - "persian.tex"
      - "adverbs.tex"
      - ".github/workflows/build-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install XeLaTeX and Persian fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-lang-arabic fontconfig poppler-utils curl

      - name: Install pinned Vazirmatn (SIL OFL 1.1)
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          for weight in Regular Bold; do
            curl --fail --show-error --silent --location --retry 3 \
              "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-${weight}.ttf" \
              --output "$HOME/.local/share/fonts/Vazirmatn-${weight}.ttf"
          done
          fc-cache -f "$HOME/.local/share/fonts"
          fc-match -f '%{family}\n' 'Vazirmatn' | grep -F 'Vazirmatn'

      - name: Compile book
        run: |
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error persian.tex
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error persian.tex
          pdfinfo persian.pdf
          pdffonts persian.pdf | grep -i 'Vazirmatn'
          test -s persian.pdf

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: purepersian-pdf
          path: persian.pdf

      - name: Keep tracked PDF synchronized
        if: github.event_name == 'push'
        run: |
          git add persian.pdf
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: regenerate Persian PDF from LaTeX sources"
            # Other agents may have advanced main while XeLaTeX ran.
            # Refuse stale sources; never force-push the generated PDF.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git diff --quiet "$GITHUB_SHA" origin/main -- persian.tex adverbs.tex; then
                echo "LaTeX sources changed during build: not publishing a stale PDF"
                exit 1
              fi
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
            done
            echo "Unable to synchronize PDF after three safe attempts"
            exit 1
          fi

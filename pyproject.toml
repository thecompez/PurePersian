[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "purepersian-mcp"
version = "0.1.0"
description = "Read-only Persian glossary and MCP tools for language-aware AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "PurePersian contributors" }]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
purepersian-mcp = "purepersian_mcp.server:main"

[tool.setuptools]
packages = ["purepersian_mcp"]
include-package-data = true

[tool.setuptools.package-data]
purepersian_mcp = ["lexicon.json"]
